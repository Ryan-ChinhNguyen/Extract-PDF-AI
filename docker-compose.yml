services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdfx
      POSTGRES_PASSWORD: pdfx
      POSTGRES_DB: pdfx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfx"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://pdfx:pdfx@db:5432/pdfx
      FA_API_TOKEN: ${FA_API_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
